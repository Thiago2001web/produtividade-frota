name: 🔄 Atualizar dados do Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 📊 Baixar CSV da planilha Google Sheets
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          echo "Baixando dados da planilha..."
          curl -L \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --output data.csv \
            "$SHEET_CSV_URL"
          
          LINES=$(wc -l < data.csv)
          echo "Arquivo baixado: $LINES linhas"
          
          if [ "$LINES" -lt 2 ]; then
            echo "❌ ERRO: CSV vazio ou inválido!"
            exit 1
          fi
          
          echo "✅ CSV atualizado com sucesso!"
          head -3 data.csv

      - name: 📝 Commitar e publicar dados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          git add data.csv
          
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados. Nenhum commit necessário."
          else
            git commit -m "📊 Dados atualizados automaticamente — $TIMESTAMP"
            git push
            echo "✅ Dados publicados!"
          fi
